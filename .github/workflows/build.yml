name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-linux:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: helbreath-client-linux-${{ inputs.build_type }}
          path: bin/helbreath_client

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: helbreath-launcher-linux-${{ inputs.build_type }}
          path: bin/helbreath

  build-windows:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: cmd
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}

      - name: Build
        shell: cmd
        run: cmake --build build --config ${{ inputs.build_type }}

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: helbreath-client-windows-${{ inputs.build_type }}
          path: |
            bin/${{ inputs.build_type }}/helbreath_client.exe
            bin/helbreath_client.exe
            bin/*.dll

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: helbreath-launcher-windows-${{ inputs.build_type }}
          path: bin/launcher/
